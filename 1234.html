<!DOCTYPE html>

<meta charset="UTF-8">
<title>Hairstyles Gallery</title>
<style>
  /* Page styling */
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #2b244a, #4b3f72);
    color: white;
    min-height: 100vh;
    overflow-y: auto;
    padding-bottom: 50px;
  }

  h1 {
    text-align: center;
    color: #da79da; /* girly purple */
    margin: 20px 0;
    text-shadow: 1px 1px 2px #fff;
  }

  /* Back button */
  .back-btn {
    display: inline-block;
    margin: 0 auto 20px auto;
    padding: 10px 20px;
    background-color: #a64ca6;
    color: white;
    font-weight: bold;
    border-radius: 10px;
    text-decoration: none;
    transition: background-color 0.2s;
  }
  .back-btn:hover {
    background-color: #c77fcf;
  }

  /* Search bar */
  #hairstyle-search {
    display: block;
    margin: 0 auto 30px auto;
    width: 300px;
    padding: 10px;
    font-size: 14px;
    border-radius: 10px;
    border: 2px solid #e672f3;
    background-color: #fff;
    color: #4a2f5e;
    text-align: center;
    box-shadow: 0 0 5px rgba(167,76,166,0.5);
  }

  #hairstyle-search:focus {
    outline: none;
    border-color: #a64ca6;
    box-shadow: 0 0 10px rgba(166,76,166,0.5);
  }

  /* Gallery container */
  #hairstyles-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
    padding: 0 20px;
  }

  /* Card styling */
  .hairstyle-card {
    background-color: #e6b1d8; /* soft pink inside cards */
    border: 2px solid #c77fcf; /* purple border */
    border-radius: 15px;
    padding: 10px;
    box-sizing: border-box;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
    cursor: pointer;
  }

  .hairstyle-card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #c77fcf;
  }

  .hairstyle-card h3 {
    font-size: 16px;
    margin: 5px 0;
    color: #4a2f5e;
  }

  .hairstyle-card a.tutorial-link {
    font-size: 13px;
    color: #a64ca6; /* bright purple link */
    font-weight: bold;
    text-decoration: underline;
  }

  .hairstyle-card:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 15px rgba(166,76,166,0.3);
    background-color: #ffd6f2; /* lighter pink hover */
  }
</style>
</head>

const container = document.getElementById("hairstyles-container");

// Generate cards
hairstyles.forEach(style => {
  const card = document.createElement("div");
  card.classList.add("hairstyle-card");

  card.innerHTML = `
    <a href="${style.link}" target="_blank">
      <img src="${style.img}" alt="${style.name}">
      <h3>${style.name}</h3>
    </a>
    <a href="${style.link}" target="_blank" class="tutorial-link">Tutorial Link</a>
  `;

  container.appendChild(card);
});

// Search functionality
const searchInput = document.getElementById('hairstyle-search');
searchInput.addEventListener('input', () => {
  const filter = searchInput.value.toLowerCase();
  const cards = document.querySelectorAll('.hairstyle-card');

  cards.forEach(card => {
    const name = card.querySelector('h3').textContent.toLowerCase();
    card.style.display = name.includes(filter) ? 'flex' : 'none';
  });
});
</script>
